plugins {
    id 'com.android.application'
}

android {
    namespace 'app.mylauncher.gtv'
    compileSdk 34

    defaultConfig {
        applicationId 'app.mylauncher.gtv'
        minSdk 26
        targetSdk 34
        versionCode 18
        versionName '0.18'
    }

    // A fixed signing key, so every new build installs over the old one (a fresh key each time would
    // force an uninstall first). It is a throw-away debug key, not a secret.
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Prayer times, worked out on the TV with no internet (MIT licence, no other dependencies).
    implementation 'com.batoulapps.adhan:adhan:1.2.1'
}
