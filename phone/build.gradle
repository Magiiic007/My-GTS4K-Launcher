plugins {
    id 'com.android.application'
}

android {
    // The same package as the TV app on purpose: the files shared with it (prayer times, Hijri dates, reminders,
    // radio) are copied in at build time and refer to the generated R of this package.
    namespace 'app.mylauncher.gtv'
    compileSdk 36

    defaultConfig {
        applicationId 'app.magiic.phone'
        minSdk 26
        targetSdk 34
        versionCode 120
        versionName '1.20'
    }

    buildFeatures {
        buildConfig true
    }

    // Two builds of the same app: "sideload" is the one updated from GitHub (it also sets up the TV and updates itself);
    // "play" is for Google Play (no installer, no TV setup, targets the newest Android as the store requires).
    flavorDimensions 'dist'
    productFlavors {
        sideload {
            dimension 'dist'
            buildConfigField 'boolean', 'PLAY', 'false'
        }
        play {
            dimension 'dist'
            targetSdk 36
            // A test copy of the Play build that installs next to the real app (CI passes -PplayTest).
            if (project.hasProperty('playTest')) applicationIdSuffix '.test'
            buildConfigField 'boolean', 'PLAY', 'true'
        }
    }

    signingConfigs {
        // The upload key for Google Play: its file and passwords come from the build environment, never from the repository.
        if (System.getenv('UPLOAD_KEYSTORE') != null) {
            upload {
                storeFile file(System.getenv('UPLOAD_KEYSTORE'))
                storePassword System.getenv('UPLOAD_STORE_PASSWORD')
                keyAlias System.getenv('UPLOAD_KEY_ALIAS') ?: 'upload'
                keyPassword System.getenv('UPLOAD_KEY_PASSWORD')
            }
        }
        debug {
            storeFile file('../app/debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        release {
            if (System.getenv('UPLOAD_KEYSTORE') != null) signingConfig signingConfigs.upload
        }
    }

    lint {
        abortOnError false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    sourceSets {
        main {
            java.srcDir "$buildDir/shared/java"
            res.srcDir "$buildDir/shared/res"
        }
    }
}

// The engine is shared with the TV app: these files are copied from ../app at every build, so a fix made once
// reaches both apps. Everything the phone does differently (screens, the adhan service, notifications) lives in
// this module.
tasks.register('syncShared', Sync) {
    into "$buildDir/shared"
    from('../app/src/main/java/app/mylauncher/gtv') {
        include 'PrayerCalc.java', 'Hijri.java', 'Cities.java', 'PrayerPrefs.java', 'Scheduler.java',
            'AdhanReceiver.java', 'Reminders.java', 'ReminderReceiver.java', 'AutoCity.java', 'Weather.java',
            'InstallReceiver.java'
        into 'java/app/mylauncher/gtv'
    }
    // The phone is Arabic only: the Arabic strings are the default ones, whatever language the phone is set to.
    from('../app/src/main/res/values') {
        include 'arrays.xml'
        into 'res/values'
    }
    from('../app/src/main/res/values-ar') {
        include 'strings.xml'
        into 'res/values'
    }
    from('../app/src/main/res/raw') {
        into 'res/raw'
    }
    from('../app/src/main/res/xml') {
        include 'network_security.xml'
        into 'res/xml'
    }
    from('../app/src/main/res/drawable') {
        include 'ic_crescent.xml'
        into 'res/drawable'
    }
}

tasks.named('preBuild') {
    dependsOn 'syncShared'
}

dependencies {
    implementation 'com.batoulapps.adhan:adhan:1.2.1'
    // The radio: live streams start faster and recover better than with the plain MediaPlayer.
    implementation 'androidx.media3:media3-exoplayer:1.4.1'
    implementation 'androidx.media3:media3-exoplayer-hls:1.4.1'
    // Setting up the TV from the phone over wireless debugging (pairing, connecting and running the setup commands).
    sideloadImplementation 'com.github.MuntashirAkon:libadb-android:3.1.1'
    sideloadImplementation 'com.github.MuntashirAkon:sun-security-android:1.1'
    sideloadImplementation 'org.conscrypt:conscrypt-android:2.5.3'
}
