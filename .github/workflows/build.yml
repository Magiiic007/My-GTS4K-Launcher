name: Build APK

# Builds the app in GitHub's cloud and publishes the APK as a release called "latest",
# so it can be downloaded from the phone or the TV with one link.
on:
  push:
    branches: [main, play-prep]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # The GitHub runner already has the Android SDK; the original Afnon project builds the same way.

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon --stacktrace

      # The phone app builds on its own, so a problem there never blocks the TV release.
      - name: Build phone
        id: phone
        continue-on-error: true
        run: ./gradlew :phone:assembleSideloadDebug --no-daemon --stacktrace

      - name: Keep the phone APK as a build artifact
        if: steps.phone.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: my-phone-apk
          path: phone/build/outputs/apk/sideload/debug/phone-sideload-debug.apk

      - name: Keep the APK as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: my-launcher-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publish the APK as release "latest"
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk my-launcher.apk
          gh release delete latest --yes --cleanup-tag || true
          # The app reads versionCode from these notes to know whether a newer build exists.
          VC=$(grep -oP "versionCode \K[0-9]+" app/build.gradle)
          VN=$(grep -oP "versionName '\K[^']+" app/build.gradle)
          gh release create latest my-launcher.apk \
            --title "Latest build" \
            --notes "versionCode=${VC} versionName=${VN} commit=${GITHUB_SHA::7}"

      - name: Publish the phone APK as release "phone-latest"
        if: steps.phone.outcome == 'success' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp phone/build/outputs/apk/sideload/debug/phone-sideload-debug.apk my-phone.apk
          gh release delete phone-latest --yes --cleanup-tag || true
          # The phone app reads versionCode from these notes to know whether a newer build exists.
          VC=$(grep -oP "versionCode \K[0-9]+" phone/build.gradle)
          VN=$(grep -oP "versionName '\K[^']+" phone/build.gradle)
          gh release create phone-latest my-phone.apk \
            --title "Latest phone build" \
            --notes "versionCode=${VC} versionName=${VN} commit=${GITHUB_SHA::7}"

      # The Google Play bundle (signed with the upload key when its secrets exist).
      - name: Build the Google Play bundle
        id: play
        continue-on-error: true
        env:
          UPLOAD_STORE_B64: ${{ secrets.UPLOAD_KEYSTORE_B64 }}
          UPLOAD_STORE_PASSWORD: ${{ secrets.UPLOAD_STORE_PASSWORD }}
          UPLOAD_KEY_ALIAS: ${{ secrets.UPLOAD_KEY_ALIAS }}
          UPLOAD_KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}
        run: |
          if [ -n "$UPLOAD_STORE_B64" ]; then
            echo "$UPLOAD_STORE_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
            export UPLOAD_KEYSTORE="$RUNNER_TEMP/upload.jks"
          fi
          ./gradlew :phone:bundlePlayRelease --no-daemon --stacktrace

      - name: Keep the Google Play bundle
        if: steps.play.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: play-bundle
          path: phone/build/outputs/bundle/playRelease/*.aab

      - name: Check the Google Play manifest
        if: steps.play.outcome == 'success'
        run: |
          M=$(find phone/build/intermediates -path '*playRelease*' -name AndroidManifest.xml | grep -i merged | head -1)
          echo "$M"
          grep -o 'targetSdkVersion="[0-9]*"' "$M"
          grep -o 'android:name="android.permission[^"]*"' "$M"
          if grep -q REQUEST_INSTALL_PACKAGES "$M"; then echo "INSTALL PERMISSION STILL THERE"; exit 1; fi

      # A test copy of the Play build (its own package name, so it installs next to the real app).
      - name: Build the Play test APK
        id: playtest
        continue-on-error: true
        run: ./gradlew :phone:assemblePlayDebug -PplayTest --no-daemon --stacktrace

      - name: Publish the Play test APK as release "play-test"
        if: steps.playtest.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp phone/build/outputs/apk/play/debug/phone-play-debug.apk my-phone-play-test.apk
          gh release delete play-test --yes --cleanup-tag || true
          gh release create play-test my-phone-play-test.apk --prerelease --target "$GITHUB_SHA" \
            --title "Play build, test copy" --notes "Test copy of the Google Play build (package app.magiic.phone.test). commit=${GITHUB_SHA::7}"
